<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Fluffy Cats — Idle Clicker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12141c; --panel:#1b1e2a; --panel2:#232736; --line:#333a4d;
  --txt:#e6e9f2; --dim:#98a0b8; --gold:#ffc94a; --green:#4ade80; --red:#f87171;
  --commoner:#9aa4bf; --clown:#e879f9; --soldier:#60a5fa; --noble:#c084fc; --knight:#34d399; --king:#fbbf24;
}
html,body{height:100%;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
#app{display:flex;height:100vh}
#left{flex:1;display:flex;flex-direction:column;min-width:0}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){background:#2d3346;border-color:#4b5570}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.buy{background:linear-gradient(#2f6b48,#1e4a30);border:1px solid #3d8a5c;color:#eafff2;text-shadow:0 1px 0 #0006}
.btn.buy:hover:not(:disabled){background:linear-gradient(#38835a,#245c3c)}
.btn.acc{background:#3a2d13;border-color:#7a5c1c;color:var(--gold)}
/* ── vùng chơi + khung gỗ ── */
#left{flex:1;display:flex;padding:16px;min-width:0}
#stage{flex:1;position:relative;min-height:0;border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 3px #2a1f12,0 0 0 10px #6b4f2e,0 0 0 13px #3a2a18,inset 0 10px 30px #000a;
  background:#1a140c}
canvas#game{display:block;width:100%;height:100%;cursor:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#coinHud{position:absolute;top:10px;right:18px;font:800 30px 'Segoe UI',system-ui,sans-serif;
  color:#ffd23f;letter-spacing:1px;pointer-events:none;
  text-shadow:2px 2px 0 #6b3d00,-2px 2px 0 #6b3d00,2px -2px 0 #6b3d00,-2px -2px 0 #6b3d00,0 3px 0 #3a2000,3px 3px 6px #000a;
  font-variant-numeric:tabular-nums}
#coinHud .cur{color:#ffb020;margin-left:2px}
.stagebtn{position:absolute;top:12px;left:12px;width:40px;height:40px;font-size:19px;
  background:linear-gradient(#3a2c17,#28200f);border:2px solid #7a5c1c;border-radius:9px;color:#ffd23f;cursor:pointer;box-shadow:0 2px 6px #0007}
.stagebtn:hover{background:#4a3820}
#warn{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#7f1d1d;border:1px solid #ef4444;padding:6px 16px;border-radius:8px;font-weight:600;font-size:14px;display:none;pointer-events:none}
#toasts{position:absolute;bottom:14px;left:14px;display:flex;flex-direction:column-reverse;gap:5px;pointer-events:none}
.toast{background:#000a;border:1px solid var(--line);padding:5px 11px;border-radius:6px;font-size:12px}
/* ── panel phải ── */
#right{width:346px;background:linear-gradient(#20232f,#171a24);border-left:1px solid #000;display:flex;flex-direction:column;padding:10px 10px 8px;gap:8px}
#tabbar{display:flex;gap:8px;justify-content:center}
.tabb{width:66px;height:60px;padding:0;background:linear-gradient(#3a2c17,#241a0d);border:3px solid #6b4f2e;border-radius:12px;cursor:pointer;box-shadow:0 2px 5px #0007;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.tabb img{width:38px;height:38px;image-rendering:pixelated;filter:saturate(.85) brightness(.8)}
.tabb:hover{transform:translateY(-2px)}
.tabb.on{border-color:#ffc94a;background:linear-gradient(#5a4320,#3a2a13);box-shadow:0 0 12px #ffc94a55,0 2px 5px #0007}
.tabb.on img{filter:none}
.tabb .ico{font-size:32px;line-height:1;opacity:.6}
.tabb.on .ico{opacity:1}
.botb .ico{font-size:21px;line-height:1}
/* ── Coach hướng dẫn từng bước (in-game) ── */
#coach{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:94%;
  display:none;align-items:center;gap:11px;padding:13px 18px;border-radius:15px;
  background:linear-gradient(#2a2038,#191426f7);border:2px solid #ffc94a;color:#fff5db;
  font-size:15.5px;font-weight:700;line-height:1.4;text-align:center;
  box-shadow:0 8px 26px #000b,0 0 0 3px #ffc94a22;z-index:15}
#coach.on{display:flex;animation:coachPop .25s ease, coachGlow 1.7s ease-in-out .3s infinite}
@keyframes coachGlow{0%,100%{box-shadow:0 8px 26px #000b,0 0 0 3px #ffc94a22}50%{box-shadow:0 8px 26px #000b,0 0 0 3px #ffc94a66,0 0 22px 3px #ffc94a88}}
#coach #coachOk{background:#ffc94a;color:#3a2a08;border:none;border-radius:9px;padding:7px 13px;font-weight:800;cursor:pointer;white-space:nowrap}
@keyframes coachPop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.tut-hl{animation:tutHl 1s ease-in-out infinite}
@keyframes tutHl{0%,100%{box-shadow:0 2px 5px #0007}50%{box-shadow:0 0 0 4px #ffc94aaa,0 0 18px #ffc94a99}}
@media(max-width:480px){#coach{font-size:13px;bottom:10px;padding:9px 12px}}
#tabtitle{display:flex;align-items:center;justify-content:center;gap:12px;color:#ffd23f;font-size:15px;font-weight:700;text-shadow:0 2px 3px #000}
#tabtitle .fl{color:#c99a3a;font-size:20px}
#tabtitle .fl.fr{transform:scaleX(-1)}
#listframe{flex:1;min-height:0;border:3px solid #c99a3a;border-radius:12px;padding:5px;
  background:linear-gradient(#161922,#10131b);box-shadow:0 0 0 2px #6b4f1e,inset 0 0 20px #0008;overflow:hidden;display:flex}
#list{flex:1;overflow-y:auto;padding:5px 6px 5px 4px}
.reincbtn{padding:12px;background:linear-gradient(#b8342e,#8a201c);border:3px solid #d9564a;border-radius:11px;
  color:#ffe9e6;font-size:15px;font-weight:700;cursor:pointer;text-shadow:0 1px 2px #0007;box-shadow:0 3px 8px #0006,inset 0 1px 0 #ffffff2a}
.reincbtn:hover{background:linear-gradient(#c94039,#9a2823)}
.reincbtn.hot{animation:reincpulse 1.1s ease-in-out infinite}
@keyframes reincpulse{0%,100%{box-shadow:0 3px 8px #0006,0 0 0 0 #ffd23f00}50%{box-shadow:0 3px 8px #0006,0 0 16px 2px #ffd23faa}}
#botbar{display:flex;gap:8px;justify-content:center;padding:7px;border:3px solid #6b4f2e;border-radius:12px;background:linear-gradient(#20232f,#141722)}
.botb{width:52px;height:40px;padding:0;background:linear-gradient(#2a2f3e,#1c202c);border:2px solid #3a4152;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.botb img{width:26px;height:26px;image-rendering:pixelated;object-fit:contain}
.botb:hover{background:#333a4d}
.row{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:7px}
.row.locked{opacity:.45}
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.rowhead b{font-size:13px}
.lv{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.rowdes{font-size:11px;color:var(--dim);margin-bottom:6px;line-height:1.4}
.rowfoot{display:flex;gap:6px;align-items:center}
.rowfoot .btn{flex:1;text-align:center;font-size:12px;padding:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
.ov{position:fixed;inset:0;background:#0b0d13f2;display:none;z-index:20;flex-direction:column}
.ov.on{display:flex}
.ovhead{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.ovhead h2{font-size:17px;flex:1}
.ovbody{flex:1;overflow:auto;padding:18px;position:relative}
#treeCv{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#treeWrap{position:absolute;inset:0}
#treeTip{position:absolute;background:#0f1219;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12px;max-width:260px;pointer-events:none;display:none;z-index:5;line-height:1.5}
#treeTip b{color:var(--gold);display:block;margin-bottom:3px}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.mapc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px}
.mapc h3{font-size:15px;margin-bottom:5px}
.mapc p{font-size:12px;color:var(--dim);min-height:34px;line-height:1.4}
.setrow{display:flex;align-items:center;gap:12px;margin-bottom:14px;max-width:460px}
.setrow label{flex:1;font-size:13px}
.setrow input[type=range]{width:150px}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px}
.uicon{width:24px;height:24px;object-fit:contain;image-rendering:pixelated;vertical-align:-7px;margin-right:8px}
#tabs button img{width:22px;height:22px;image-rendering:pixelated;vertical-align:-5px;margin-right:6px}
.btn .bico{width:17px;height:17px;image-rendering:pixelated;vertical-align:-4px;margin-right:5px}
.coinico{width:15px;height:15px;image-rendering:pixelated;vertical-align:-3px;margin:0 3px}
.doc{max-width:760px;font-size:13px;line-height:1.75;color:var(--dim)}
.doc h3{color:var(--txt);font-size:15px;margin:18px 0 7px}
.doc b{color:var(--txt)}
.doc ul{padding-left:20px}
@media(max-width:900px){#right{width:290px}}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="coinHud"><span id="hudCoin">0</span><span class="cur">$</span></div>
      <div id="warn"></div>
      <div id="toasts"></div>
      <div id="coach"><span id="coachMsg"></span><button id="coachOk" hidden>OK 👍</button></div>
    </div>
  </div>
  <div id="right">
    <div id="tabbar">
      <button data-tab="items" class="tabb on" title="Đơn vị"><span class="ico">🐱</span></button>
      <button data-tab="upg" class="tabb" title="Nâng cấp"><span class="ico">⬆️</span></button>
      <button data-tab="info" class="tabb" title="Thông tin"><span class="ico">📊</span></button>
    </div>
    <div id="tabtitle"><span class="fl">❧</span><span id="tabName">Vật phẩm</span><span class="fl fr">❧</span></div>
    <div id="listframe"><div id="list"></div></div>
    <button id="bReinc" class="reincbtn"><span data-t="tree">Cây kỹ năng</span> (<span id="reincN">0</span>)</button>
    <div id="botbar">
      <button id="bSteam" class="botb" title="Về game"><span class="ico">📖</span></button>
      <button id="bInfo" class="botb" title="Nguồn &amp; giấy phép"><span class="ico">🏆</span></button>
      <button id="bSet" class="botb" title="Cài đặt"><span class="ico">⚙️</span></button>
      <button id="bHelp" class="botb" title="Cách chơi"><span class="ico">❓</span></button>
    </div>
  </div>
</div>

<div class="ov" id="ovTree">
  <div class="ovhead">
    <h2 data-t="tree">Cây kỹ năng</h2>
    <span id="treePts" style="color:#a78bfa;font-weight:600"></span>
    <div style="flex:1;max-width:300px">
      <div id="tpTreeNum" style="font-size:11px;color:var(--dim);text-align:center;margin-bottom:3px"></div>
      <div style="height:8px;background:#0d0f16;border-radius:5px;overflow:hidden;border:1px solid var(--line)"><div id="tpTreeFill" style="height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#a78bfa)"></div></div>
    </div>
    <button class="btn acc" id="bRebirth">♻️ <span data-t="rebirth">Chuyển sinh</span></button>
    <button class="btn" id="bTreeClose">✕</button>
  </div>
  <div class="ovbody" style="padding:0"><div id="treeWrap"><canvas id="treeCv"></canvas><div id="treeTip"></div></div></div>
</div>

<div class="ov" id="ovMap">
  <div class="ovhead"><h2 data-t="selmap">Chọn bản đồ</h2><button class="btn" id="bMapClose" style="margin-left:auto">✕</button></div>
  <div class="ovbody"><div class="maps" id="mapList"></div></div>
</div>

<div class="ov" id="ovSet">
  <div class="ovhead"><h2 data-t="settings">Cài đặt</h2><button class="btn" id="bSetClose" style="margin-left:auto">✕</button></div>
  <div class="ovbody">
    <div class="setrow"><label data-t="lang">Ngôn ngữ</label><button class="btn" id="bLang">Tiếng Việt</button></div>
    <div class="setrow"><label data-t="shake">Rung màn hình</label><input type="checkbox" id="cShake" checked></div>
    <div class="setrow"><label data-t="hideMoney">Ẩn hiển thị tiền</label><input type="checkbox" id="cHide"></div>
    <div class="setrow"><label data-t="cursor">Kích thước con trỏ</label><input type="range" id="rCursor" min="20" max="90" value="45"></div>
    <div class="setrow"><label data-t="demoLock">Khoá bản demo (giữ nguyên như bản gốc)</label><input type="checkbox" id="cDemo" checked></div>
    <div class="setrow" style="margin-top:26px"><label style="color:var(--red)" data-t="resetQ">Bạn có chắc muốn Đặt lại tiến trình?</label><button class="btn" id="bReset" style="border-color:#7f1d1d;color:var(--red)" data-t="reset">Đặt lại tiến trình</button></div>
  </div>
</div>

<div class="ov" id="ovDoc">
  <div class="ovhead"><h2>Về game</h2><button class="btn" id="bDocClose" style="margin-left:auto">✕</button></div>
  <div class="ovbody"><div class="doc" id="docBody"></div></div>
</div>

  let e=Math.floor(Math.log10(n)/3); e=Math.min(e,SUF.length-1);
  const m=n/Math.pow(1000,e);
  return (m<10?m.toFixed(2):m<100?m.toFixed(1):Math.floor(m))+SUF[e];
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

const itemLv = k=>S.itemLv[k]||0;
const upgLv  = k=>S.upgLv[k]||0;
const upgVal = k=>{ const tb=UPG[k]; if(!tb) return 0; return tb[Math.min(upgLv(k),tb.length-1)][1]; };
const upgPrice=k=>{ const tb=UPG[k]; const l=upgLv(k); return (l>=tb.length-1)?null:tb[l][0]; };

function nodeOpen(i){ return S.nodes.includes(i); }
function treeSum(key){ let s=0; for(const n of TREE) if(n.k===key && nodeOpen(n.i)) s+=n.v; return s; }
function treeHas(key){ return treeSum(key)>0; }
function tierMult(tier){ const v=treeSum("Tree_"+tier+"_value"); return v>0?v:1; }

/* ── điều kiện mở node: có ô kề trực giao đã mở (ROOT ở (0,0) luôn mở) ── */
function nodeAt(x,y){ return TREE.find(n=>n.x===x&&n.y===y); }
function canUnlock(n){
  if(nodeOpen(n.i)) return false;
  if(S.set.demo && n.demo) return false;
  const nb=[[1,0],[-1,0],[0,1],[0,-1]];
  for(const [dx,dy] of nb){
    const x=n.x+dx, y=n.y+dy;
    if(x===0&&y===0) return true;               // kề ROOT
    const m=nodeAt(x,y); if(m && nodeOpen(m.i)) return true;
  }
  return false;
}
function nodeVisible(n){
  if(nodeOpen(n.i)) return true;
  const nb=[[1,0],[-1,0],[0,1],[0,-1]];
  for(const [dx,dy] of nb){
    const x=n.x+dx,y=n.y+dy;
    if(x===0&&y===0) return true;
    const m=nodeAt(x,y); if(m&&nodeOpen(m.i)) return true;
  }
  return false;
}
// gỡ node: chỉ cho gỡ nếu không làm đứt nhánh (DFS lại từ ROOT)
function canLock(n){
  if(!nodeOpen(n.i)) return false;
  const rest=S.nodes.filter(i=>i!==n.i);
  const seen=new Set(); const st=[[0,0]];
  while(st.length){
    const [x,y]=st.pop();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const m=nodeAt(x+dx,y+dy);
      if(m && rest.includes(m.i) && !seen.has(m.i)){ seen.add(m.i); st.push([m.x,m.y]); }
    }
  }
  return seen.size===rest.length;
}

function mkHuman(tier,x,y){
  return {tier, x:x!==undefined?x:rnd(60,W-60), y:y!==undefined?y:rnd(60,H-60),
    tx:0,ty:0, spd:rnd(50,82), state:"walk", t:rnd(0,3), down:0, clumsy:rnd(0,10),
    face:1, bob:rnd(0,6.28), golden:false, sleep:false, af:rnd(0,1), fr:0, nap:0, ph:rnd(0,50), jumpT:0};
}
function humAnimState(h){ return h.state==="down"?"down": h.sleep?"sleep": h.state==="walk"?"walk":"idle"; }
function retargetHuman(h){
  // ~48% nhắm HẲN về sát 1 trong 4 GÓC -> mèo phủ cả góc, không tụ giữa
  if(Math.random()<0.48){
    const left=Math.random()<0.5, top=Math.random()<0.5;
    h.tx = left ? rnd(40,W*0.17) : rnd(W*0.83,W-40);
    h.ty = top  ? rnd(30,H*0.19) : rnd(H*0.81,H-30);
    return;
  }
  // còn lại: điểm ngẫu nhiên TOÀN màn, chỉ ưu tiên chỗ ÍT ĐÔNG (KHÔNG ưu tiên xa -> đỡ dồn qua giữa)
  let best=null,bs=-1e9;
  for(let i=0;i<6;i++){
    const px=rnd(36,W-36), py=rnd(30,H-30);
    let crowd=0; for(const o of humans) if(o!==h && dist2(px,py,o.x,o.y)<120*120) crowd++;
    const score=-crowd*300 + rnd(0,120);
    if(score>bs){ bs=score; best={x:px,y:py}; }
  }
  h.tx=best.x; h.ty=best.y;
}
function knock(h, src){
  if(h.state==="down"||h.sleep) return 0;
  h.state="down"; h.down=isCat()?0.9:1.7; h.af=0; h.fr=0; h.nap=0;
  if(isCat()) h.jumpT=0.62;                 // mèo bật nhảy HOẢNG HỐT khi bị tap
  let v = humanValue(h.tier);
  let lucky=false, jack=false;
  if(G.luckyFallOn && Math.random()<BASE.luckyFall){ v*=BASE.luckyFallMult; lucky=true; }
  if(h.golden) v*=3;
  if(goldenPunch>0 && src==="click") v*=5;
  if(buffThief>0) v*=5;
  if((src==="bull"||src==="elephant") && Math.random()<G.animalRewardChance) v*=G.animalRewardMult;
  if(boss) v*=0.5;
  if(G.x10Map && Math.random()<0.02){ v*=10; jack=true; }
  if(isCat()) v*=CAT_INCOME_MULT;     // giảm thu nhập theme Mèo
  spawnCoins(h.x,h.y,v,lucky,jack);   // tap chỉ VĂNG LÔNG ra, KHÔNG cộng/hiện tiền
  if(jack) toast(t("jackpot"));
  if(src==="click"){ punchIdle=0; if(window.tutStat) tutStat.tapped=true; }
  // Chain Reaction
  if(G.chainOn && src!=="chain" && Math.random()<BASE.chainChance){
    const r2=G.chainRad*G.chainRad;
    for(const o of humans){
      if(o===h||o.state==="down") continue;
      if(dist2(o.x,o.y,h.x,h.y)<r2 && Math.random()<G.chainPct){
        fx.push({k:"chain",x:h.x,y:h.y,x2:o.x,y2:o.y,t:.3});
        setTimeout(()=>knock(o,"chain"),60);
      }
    }
  }
  return v;
}

function coinTier(v,maxV){

}
function spawnCoins(x,y,total,lucky,jack){
  // Mệnh giá lông: ≤1k = 1 cục kem, 2k = 2 cục kem, ≥3k = cục MÀU KHÁC (gộp, mệnh giá cao)
  let n, tier;
  if(total<=2000){ n=Math.max(1,Math.ceil(total/1000)); tier=0; }
  else { tier = total>=1e6?2:1; n=clamp(Math.round(1+Math.log10(total/1000)*0.6),1,4); }
  const per=total/n;
  for(let i=0;i<n;i++){
    if(coins.length>=MAXCOINS) coins.shift();          // RemoveOldestCoin
    const a=rnd(0,6.283), sp=rnd(28,90);               // chỉ văng NHẸ theo phương ngang để không chồng đống
    coins.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*0.6,z:0,vz:0,   // z=0,vz=0: phân NẰM NGAY trên đất, KHÔNG nẩy lên
      v:per, tier, st:0, t:0, tx:0,ty:0, landed:true, settle:0.32, lucky:!!lucky, jack:!!jack});
  }
}
function collectCoin(c, byCollector){

  checkTreeLevel();
}
function checkTreeLevel(){

}

let last=performance.now(), acc=0;
function loop(now){
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.05);

function update(dt){
  S.playtime+=dt; animClock+=dt;
  if(shake>0) shake=Math.max(0,shake-dt*7);
  if(buffThief>0) buffThief-=dt;
  if(goldenPunch>0) goldenPunch-=dt;

  // Golden Punch: không đấm trong 30s → x5 trong 5s
  if(G.goldenPunch){
    punchIdle+=dt;
    if(punchIdle>=BASE.goldenPunchIdle && goldenPunch<=0){ goldenPunch=BASE.goldenPunchDur; punchIdle=0; toast("GOLDEN PUNCH x5"); }
  }
  // Auto Breaker
  if(G.autoBreaker){
    cdAuto-=dt;
    if(cdAuto<=0){ cdAuto=0.55; const alive=humans.filter(h=>h.state!=="down"&&!h.sleep); if(alive.length){ const h=alive[rint(0,alive.length-1)]; knock(h,"auto"); fx.push({k:"punch",x:h.x,y:h.y,t:.25}); } }
  }
  // Lightning
  if(G.lightningOn){ cdLight-=dt; if(cdLight<=0){ cdLight=G.lightningCd; castLightning(); } }
  // Meteorite
  if(G.rocketOn){ cdRocket-=dt; if(cdRocket<=0){ cdRocket=G.rocketCd; castRocket(); } }
  // Gift
  if(G.giftOn){ cdGift-=dt; if(cdGift<=0){ cdGift=BASE.giftCd; gifts.push({x:rnd(80,W-80),y:rnd(80,H-80),t:20}); } }
  // Thief
  if(G.thiefCount>0){ cdThief-=dt; if(cdThief<=0){ cdThief=BASE.thiefAppear; for(let i=0;i<G.thiefCount;i++) thieves.push({x:rnd(80,W-80),y:rnd(80,H-80),tx:0,ty:0,hp:3,t:25}); } }
  // Boss
  cdBoss-=dt;
  if(!boss && cdBoss<=0){ spawnBoss(); }

  updateHumans(dt); updateAnimals(dt); updateCollectors(dt);
  updateCoins(dt); updateThieves(dt); updateGifts(dt); updateBoss(dt); updateGuardians(dt);

  for(let i=labels.length-1;i>=0;i--){ labels[i].t-=dt; if(labels[i].t<=0) labels.splice(i,1); }
  for(let i=fx.length-1;i>=0;i--){ fx[i].t-=dt; if(fx[i].t<=0) fx.splice(i,1); }
  for(let i=auras.length-1;i>=0;i--){ auras[i].t-=dt; if(auras[i].t<=0){ auras[i].x=rnd(160,W-160); auras[i].y=rnd(160,H-160); auras[i].t=BASE.auraDuration; } }

  hudTick-=dt; if(hudTick<=0){ hudTick=0.1; updateHUD(); }
  saveTick-=dt; if(saveTick<=0){ saveTick=5; save(); }
  coachTick();         // hướng dẫn từng bước: kiểm tra hành động để sang bước kế
  mouse.moved=false;   // reset cuối frame: chỉ nhặt khi con trỏ đang quét qua lông
}

function updateHumans(dt){
  const clumsyKey=t=>t+"_Clumsy";
  for(const h of humans){
    if(h.jumpT>0) h.jumpT-=dt;
    // tiến frame animation cho mọi trạng thái
    const as=HROW[humAnimState(h)]; h.af+=dt*as.fps;
    if(humAnimState(h)==="down"){ h.fr=Math.min(as.n-1,Math.floor(h.af)); }
    else h.fr=Math.floor(h.af)%as.n;
    if(h.sleep) continue;
    if(h.state==="down"){ h.down-=dt; if(h.down<=0){ h.state="walk"; retargetHuman(h);} continue; }
    // Mèo: thỉnh thoảng nằm xuống ngủ
    if(isCat()){
      if(h.nap>0){ h.nap-=dt; h.bob=0; continue; }
      if(h.state!=="down" && Math.random()<dt*0.03){ h.nap=rnd(3.5,7); h.state="idle"; continue; }
    }
    // Clumsy: mỗi 10s có x% tự ngã
    h.clumsy+=dt;
    if(h.clumsy>=10){ h.clumsy=0; const c=upgVal(clumsyKey(h.tier)); if(c>0&&Math.random()<c) { knock(h,"clumsy"); continue; } }
    h.t-=dt;
    if(h.t<=0){ h.t=rnd(2,5); if(Math.random()<0.25){h.state="idle";} else if(h.state==="idle"){h.state="walk";} }  // chỉ tạm dừng/đi tiếp
    if(h.state==="walk"){
      const dx=h.tx-h.x, dy=h.ty-h.y, d=Math.hypot(dx,dy);
      if(d<8){ retargetHuman(h); } else { h.x+=dx/d*h.spd*dt; h.y+=dy/d*h.spd*dt; h.face=dx<0?-1:1; }  // đi HẲN tới đích rồi mới đổi
    }
    h.bob+=dt*7;
    // Golden Aura
    h.golden=false;
    for(const a of auras) if(dist2(h.x,h.y,a.x,a.y)<G.auraRad*G.auraRad){ h.golden=true; break; }
  }
}
function updateDog(a,dt){
  if(a.dirx===undefined){ a.dirx=1; a.diry=0; a.st="rest"; a.t=rnd(0.5,2); }
  if(a.st!=="rest"&&a.st!=="lie"&&a.st!=="windup"&&a.st!=="charge"){ a.st="rest"; a.t=rnd(0.8,2); }
  if(a.st==="rest"||a.st==="lie"){
    a.t-=dt;
    if(a.t<=0){ // lấy đà
      a.st="windup"; a.t=0.5;
      a.tx=rnd(55,W-55); a.ty=rnd(55,H-55);   // đích rộng ra tới sát góc
      const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy)||1; a.dirx=dx/d; a.diry=dy/d; a.face=dx<0?-1:1;
    }
    return;
  }
  if(a.st==="windup"){
    a.t-=dt; a.x-=a.dirx*26*dt; a.y-=a.diry*26*dt;   // lùi lại lấy đà
    if(a.t<=0){ a.st="charge"; doShake(2); }
    return;
  }
  if(a.st==="charge"){
    const sp=(a.kind==="Elephant"?560:600);
    a.x+=a.dirx*sp*dt; a.y+=a.diry*sp*dt;
    const R=(a.kind==="Elephant"?86:70)*a.scale;
    for(const h of humans) if(h.state!=="down"&&!h.sleep && dist2(h.x,h.y,a.x,a.y)<R*R){ knock(h,a.kind.toLowerCase()); }
    if(dist2(a.x,a.y,a.tx,a.ty)<50*50 || a.x<44||a.x>W-44||a.y<44||a.y>H-44){
      a.x=clamp(a.x,44,W-44); a.y=clamp(a.y,44,H-44); doShake(4);
      // hồi lâu hơn; nâng cấp Energy sau này -> hồi nhanh lại
      const em=1-Math.min(0.62, upgVal(a.kind+"_Energy")/170);
      if(Math.random()<0.32){ a.st="lie"; a.t=rnd(6,10)*em; }   // đôi lúc nằm nghỉ lâu
      else { a.st="rest"; a.t=rnd(3.2,6)*em; }
    }
    return;
  }
}
function updateAnimals(dt){
  for(const a of animals){
    if(isCat()){ updateDog(a,dt); continue; }   // boss ra vẫn hoạt động bình thường
    if(a.st==="sleep"){ a.t-=dt; if(a.t<=0){ a.st="patrol"; a.energy=a.max; } continue; }
    a.energy-=dt;
    if(a.energy<=0){ a.st="sleep"; a.t=8; continue; }
    a.cd-=dt;
    const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
    if(d<12){ a.tx=rnd(60,W-60); a.ty=rnd(60,H-60); }
    else { const sp=(a.kind==="Bull"?95:70); a.x+=dx/d*sp*dt; a.y+=dy/d*sp*dt; a.face=dx<0?-1:1; }
    if(a.cd<=0){
      const R=(a.kind==="Bull"?58:82)*a.scale;
      let hit=false;
      for(const h of humans) if(h.state!=="down" && dist2(h.x,h.y,a.x,a.y)<R*R){ knock(h,a.kind.toLowerCase()); hit=true; }
      if(hit){ a.cd=1.1; fx.push({k:"aoe",x:a.x,y:a.y,r:R,t:.35}); doShake(3); }
    }
  }
}
function updateCollectors(dt){
  const sp=64*(BASE.collectorSpeed+upgVal("Collector_Speed"));   // chạy chậm lại
  const rad=34*(BASE.collectorRadius+upgVal("Collector_Radius"));
  const taken=new Set();
  for(const c of collectors){
    // tách khỏi robot khác để không chồng/không đi cùng 1 đường
    for(const o of collectors){ if(o===c) continue; const dx=c.x-o.x,dy=c.y-o.y,d2=dx*dx+dy*dy; if(d2<58*58 && d2>1){ const d=Math.sqrt(d2); c.x+=dx/d*46*dt; c.y+=dy/d*46*dt; } }
    // mỗi robot nhắm cục lông GẦN NHẤT CHƯA bị robot khác nhận
    let best=null,bd=1e9;
    for(const co of coins){ if(co.st!==0||co.claim) continue; const d=dist2(c.x,c.y,co.x,co.y); if(d<bd){bd=d;best=co;} }
    if(best){ best.claim=true; taken.add(best); const dx=best.x-c.x,dy=best.y-c.y,d=Math.hypot(dx,dy)||1; c.x+=dx/d*sp*dt; c.y+=dy/d*sp*dt; }
    for(const co of coins) if(co.st===0 && co.landed && co.settle<=0 && dist2(c.x,c.y,co.x,co.y)<rad*rad){ co.st=1; co.tx=c.x; co.ty=c.y; co.by=1; }
    c.r=rad;
  }
  for(const co of coins) co.claim=false;   // reset đặt chỗ mỗi frame
}
function updateCoins(dt){
  const hov=52;
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    if(c.st===0){
      c.x+=c.vx*dt; c.y+=c.vy*dt; c.vx*=0.93; c.vy*=0.93;
      c.z+=c.vz*dt; c.vz-=420*dt;
      if(c.z<0){ c.z=0; c.vz*=-0.42; if(!c.landed){ c.landed=true; c.settle=0.4; } if(Math.abs(c.vz)<25) c.vz=0; }   // chạm đất
      if(c.settle>0) c.settle-=dt;                                          // nằm yên 1 nhịp mới nhặt được
      c.x=clamp(c.x,8,W-8); c.y=clamp(c.y,8,H-8);
      if(c.landed && c.settle<=0 && mouse.moved && mouse.x>-500 && dist2(c.x,c.y,mouse.x,mouse.y)<hov*hov){
        c.st=1; c.by=0;
        if(!S.set.hideMoney) labels.push({x:c.x,y:c.y,v:c.v,t:1.15,lucky:c.lucky,jack:c.jack});   // hiện +tiền NGAY khi chạm vào phân, tại chỗ đó
      }
    } else {
      c.t+=dt*3.4;
      const tx=c.by?c.tx:mouse.x, ty=c.by?c.ty:mouse.y;
      c.x+=(tx-c.x)*Math.min(1,dt*11); c.y+=(ty-c.y)*Math.min(1,dt*11); c.z*=0.9;
      if(c.t>0.55 || dist2(c.x,c.y,tx,ty)<64){ collectCoin(c,c.by===1); coins.splice(i,1); }
    }
  }
}
function updateThieves(dt){
  for(let i=thieves.length-1;i>=0;i--){
    const th=thieves[i]; th.t-=dt;
    const dx=th.tx-th.x, dy=th.ty-th.y, d=Math.hypot(dx,dy);
    if(d<10){ th.tx=rnd(60,W-60); th.ty=rnd(60,H-60); } else { th.x+=dx/d*150*dt; th.y+=dy/d*150*dt; }
    if(th.t<=0) thieves.splice(i,1);
  }
}
function updateGifts(dt){ for(let i=gifts.length-1;i>=0;i--){ gifts[i].t-=dt; if(gifts[i].t<=0) gifts.splice(i,1); } }
function updateGuardians(dt){
  for(const g of guardians){
    if(!boss) continue;
    const dx=boss.x-g.x, dy=boss.y-g.y, d=Math.hypot(dx,dy)||1;
    if(d>70){ g.x+=dx/d*90*dt; g.y+=dy/d*90*dt; }
    else { g.cd-=dt; if(g.cd<=0){ g.cd=1; hitBoss(boss.max*0.02); } }
  }
}
function spawnBoss(){
  const mini=(S.bossN||0)===0 ? false : Math.random()<0.7;   // boss ĐẦU TIÊN luôn là chuột ĐEN (ratboss)
  S.bossN=(S.bossN||0)+1;
  const hp=(mini?12:30)*Math.max(1,Math.pow(1.7,S.treeLevel));
  boss={x:W/2,y:H/2,ax:rnd(240,W-240),ay:rnd(180,H-180),hp:hp,max:hp,mini,block:0,blocked:false,t:0,dir:-1,wx:rnd(80,W-80),wy:rnd(70,H-70)};
  showWarn(true);   // boss ra: mèo vẫn hoạt động, chỉ giảm nửa tiền (xem knock)
}
function hitBoss(d){
  if(!boss||boss.blocked) return;
  boss.hp-=d; doShake(2);
  fx.push({k:"hit",x:boss.x+rnd(-30,30),y:boss.y+rnd(-30,30),t:.25});
  if(boss.hp<=0){
    const reward=humanValue("Commoner")*32*(boss.mini?1:3);   // thưởng hạ boss (giảm so với trước)
    spawnCoins(boss.x,boss.y,reward);
    S.bossKills=(S.bossKills||0)+1;   // diệt càng nhiều -> boss sau ăn phân càng nhanh
    toast(t("bossDown"));
    boss=null; humans.forEach(h=>{h.sleep=false;retargetHuman(h);});
    cdBoss=rnd(140,200); showWarn(false); doShake(8);   // giãn cách giữa 2 boss (~2.3–3.3 phút)
  }
}
function updateBoss(dt){
  if(!boss) return;
  boss.t+=dt; boss.block-=dt;
  if(boss.block<=0){ boss.blocked=!boss.blocked; boss.block=boss.blocked?1.5:4.5; }
  if(boss.eatFlash>0) boss.eatFlash-=dt;
  // ── Chuột chạy KHẮP MÀN ăn phân: nhắm cục phân gần nhất; hết phân thì lang thang điểm ngẫu nhiên. Diệt càng nhiều -> càng nhanh ──
  const kills=S.bossKills||0;
  const rush=Math.min(1+kills*0.18, 3.6);                 // +18% tốc độ mỗi lần diệt (trần 3.6x)
  const speed=(boss.mini?80:106)*rush, eatR=boss.mini?36:48;
  let tgt=null, bd=1e9;
  for(const c of coins){ if(c.st!==0||!c.landed) continue; const d=dist2(c.x,c.y,boss.x,boss.y); if(d<bd){ bd=d; tgt=c; } }
  let tx,ty;
  if(tgt){ tx=tgt.x; ty=tgt.y; }
  else {                                                  // không còn phân -> đi tới điểm lang thang mới khắp màn
    if(dist2(boss.x,boss.y,boss.wx,boss.wy)<44*44){ boss.wx=rnd(80,W-80); boss.wy=rnd(70,H-70); }
    tx=boss.wx; ty=boss.wy;
  }
  const dx=tx-boss.x, dy=ty-boss.y, d=Math.hypot(dx,dy)||1;
  if(dx<-3) boss.dir=-1; else if(dx>3) boss.dir=1;        // quay mặt theo hướng đi (đi thẳng, không lùi)
  const stop=tgt?eatR:8;                                  // ăn phân: dừng ở tầm ăn · lang thang: đi tới sát điểm (không kẹt vùng chết)
  if(d>stop){ boss.x+=dx/d*speed*dt; boss.y+=dy/d*speed*dt; }
  else if(tgt){                                           // ăn: xoá mọi cục phân trong tầm (mất tiền người chơi)
    for(let i=coins.length-1;i>=0;i--){ const c=coins[i]; if(c.st===0 && c.landed && dist2(c.x,c.y,boss.x,boss.y)<eatR*eatR){ coins.splice(i,1); boss.eatFlash=0.22; } }
  }
  boss.x=clamp(boss.x,60,W-60); boss.y=clamp(boss.y,60,H-60);
}
function castLightning(){
  const alive=humans.filter(h=>h.state!=="down"&&!h.sleep); if(!alive.length) return;
  const c=alive[rint(0,alive.length-1)];
  fx.push({k:"light",x:c.x,y:c.y,t:.4});
  for(const h of humans) if(dist2(h.x,h.y,c.x,c.y)<120*120) knock(h,"lightning");
  doShake(6);
}
function castRocket(){
  const x=rnd(120,W-120), y=rnd(120,H-120);
  fx.push({k:"rocket",x,y,t:.55});
  setTimeout(()=>{
    for(const h of humans) if(dist2(h.x,h.y,x,y)<170*170) knock(h,"rocket");
    fx.push({k:"aoe",x,y,r:170,t:.4}); doShake(11);
  },320);
}
function openGift(g){
  const roll=Math.random();
  let v;
  if(roll<0.6) v=humanValue("Commoner")*60;
  else if(roll<0.9) v=humanValue("Commoner")*260;
  else v=humanValue("Commoner")*1200;
  spawnCoins(g.x,g.y,v); toast(t("giftGot",fmt(v)));
}
function showWarn(on){
  const w=document.getElementById("warn");
  w.style.display=on?"block":"none"; w.textContent=t(isCat()?"bossWarnCat":"bossWarn");
}

/* ─────────────────────────── 7. VẼ ─────────────────────────── */
function render(){
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  cx.clearRect(0,0,cv.width,cv.height);
  cx.save();
  const sx=shake>0?rnd(-shake,shake):0, sy=shake>0?rnd(-shake,shake):0;
  cx.translate(view.ox+sx,view.oy+sy); cx.scale(view.s,view.s);

  drawGround();
  for(const a of auras) drawAura(a);
  for(const f of fx) if(f.k==="chain") { cx.strokeStyle="#facc15aa"; cx.lineWidth=3; cx.beginPath(); cx.moveTo(f.x,f.y); cx.lineTo(f.x2,f.y2); cx.stroke(); }
  for(const f of fx) if(f.k==="aoe"){ cx.strokeStyle="#fb923c"; cx.globalAlpha=f.t*2; cx.lineWidth=4; cx.beginPath(); cx.arc(f.x,f.y,f.r*(1.4-f.t),0,6.283); cx.stroke(); cx.globalAlpha=1; }

  const order=[...humans.map(o=>({o,y:o.y,k:"h"})),...animals.map(o=>({o,y:o.y,k:"a"})),
               ...collectors.map(o=>({o,y:o.y,k:"c"})),...guardians.map(o=>({o,y:o.y,k:"g"})),
               ...thieves.map(o=>({o,y:o.y,k:"t"})),...gifts.map(o=>({o,y:o.y,k:"gi"}))];
  if(boss) order.push({o:boss,y:boss.y,k:"b"});
  order.sort((a,b)=>a.y-b.y);
  for(const e of order){
    if(e.k==="h") drawHuman(e.o); else if(e.k==="a") drawAnimal(e.o);
    else if(e.k==="c") drawCollector(e.o); else if(e.k==="g") drawGuardian(e.o);
    else if(e.k==="t") drawThief(e.o); else if(e.k==="gi") drawGift(e.o);
    else if(e.k==="b") drawBoss(e.o);
  }
  for(const c of coins) drawCoin(c);
  for(const f of fx) drawFx(f);
  drawCursor();
  cx.restore();
  // +tiền vẽ Ở TOẠ ĐỘ MÀN HÌNH (cỡ chữ cố định) -> luôn rõ trên mọi màn hình, kể cả mobile zoom nhỏ
  if(!S.set.hideMoney){ const ox=view.ox+sx, oy=view.oy+sy; for(const l of labels) drawLabel(l,ox,oy,view.s); }
}
const CATBG_COUNT=5;
function drawGround(){
  if(isCat()){
    const bk="catbg"+((S.rebirths||0)%CATBG_COUNT);        // mỗi lần Chuyển sinh -> nền mới
    const img = catHas(bk)?CATIMG[bk] : (catHas("catbg")?CATIMG["catbg"]:null);
    if(img){ cx.imageSmoothingEnabled=false; cx.drawImage(img,0,0,W,H); cx.fillStyle="#0b0d1330"; cx.fillRect(0,0,W,H); return; }
  }
  const bgk="bg"+S.mapIndex, img=IMG[bgk];
  if(img&&img._ok){
    cx.imageSmoothingEnabled=true;
    cx.drawImage(img,0,0,W,H);
    cx.fillStyle="#0b0d1355"; cx.fillRect(0,0,W,H);   // phủ tối nhẹ cho dễ nhìn nhân vật
  } else {
    const g=cx.createLinearGradient(0,0,0,H);
    const pal=[["#1d2433","#141a26"],["#1f2b22","#141c17"],["#2b2416","#1c180f"],["#241c2e","#181120"]][S.mapIndex];
    g.addColorStop(0,pal[0]); g.addColorStop(1,pal[1]);
    cx.fillStyle=g; cx.fillRect(0,0,W,H);
    cx.strokeStyle="#ffffff08"; cx.lineWidth=1;
    for(let x=0;x<=W;x+=80){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();}
    for(let y=0;y<=H;y+=80){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}
  }
  cx.strokeStyle="#ffffff18"; cx.lineWidth=2; cx.strokeRect(1,1,W-2,H-2);
}
function drawAura(a){
  const r=G.auraRad;
  if(has("glow")){ cx.globalAlpha=.6; cx.imageSmoothingEnabled=true; cx.drawImage(IMG.glow,a.x-r,a.y-r,r*2,r*2); cx.globalAlpha=1; }
  else { const g=cx.createRadialGradient(a.x,a.y,0,a.x,a.y,r); g.addColorStop(0,"#fbbf2438"); g.addColorStop(.75,"#fbbf2418"); g.addColorStop(1,"#fbbf2400"); cx.fillStyle=g; cx.beginPath(); cx.arc(a.x,a.y,r,0,6.283); cx.fill(); }
  cx.strokeStyle="#fbbf2455"; cx.lineWidth=2; cx.beginPath(); cx.arc(a.x,a.y,r,0,6.283); cx.stroke();
  if(has("sun")){ const s=26+Math.sin(performance.now()/500)*3; cx.imageSmoothingEnabled=false; cx.drawImage(IMG.sun,a.x-s/2,a.y-s/2,s,s); }
}
function shadow(x,y,r){ cx.fillStyle="#00000055"; cx.beginPath(); cx.ellipse(x,y+2,r,r*0.4,0,0,6.283); cx.fill(); }
function drawHuman(h){
  const down=h.state==="down";
  // ── THEME MÈO ──
  if(isCat()){ drawCat(h); return; }
  shadow(h.x,h.y,down?14:8);
  if(h.golden){ cx.strokeStyle="#fbbf24"; cx.lineWidth=2; cx.globalAlpha=.9; cx.beginPath(); cx.arc(h.x,h.y-16,18,0,6.283); cx.stroke(); cx.globalAlpha=1; }
  const img=IMG["h_"+h.tier];
  if(img&&img._ok){
    const as=HROW[humAnimState(h)];
    const S=1.35, dw=HF*S, dh=HF*S;
    if(h.sleep) cx.globalAlpha=.55;
    // frame ở đáy 57px căn vào chân (chừa ~6px viền dưới của cell)
    drawSheet(img, h.fr, as.r, HF, HF, h.x, h.y+7, dw, dh, h.face<0);
    cx.globalAlpha=1;
    return;
  }
  // fallback vector
  const c=TIER_COL[h.tier];
  cx.save(); cx.translate(h.x,h.y); if(down) cx.rotate(1.35); if(h.sleep) cx.globalAlpha=0.4;
  const bob=down?0:Math.sin(h.bob)*1.4;
  cx.fillStyle=c; cx.beginPath(); cx.roundRect(-6,-22+bob,12,17,4); cx.fill();
  cx.fillStyle="#f4d7b0"; cx.beginPath(); cx.arc(0,-27+bob,6,0,6.283); cx.fill();
  cx.restore();
}
function drawCat(h){
  const ci=CATMAP[h.tier]||1;
  const napping=h.nap>0, reacting=h.state==="down";
  let key,cnt,fps;
  if(napping){ key="c"+ci+"_sleep"; cnt=2; fps=1.4; }
  else if(reacting){ key="c"+ci+"_react"; cnt=2; fps=9; }
  else if(h.state==="walk"){ key="c"+ci+"_walk"; cnt=4; fps=9; }
  else { key="c"+ci+"_idle"; cnt=2; fps=2.5; }
  const fi=Math.floor(animClock*fps + h.ph)%cnt;
  let spr=CATIMG[key+fi]; if(!spr||!spr._ok) spr=CATIMG["c"+ci+"_sit"]||CATIMG["c"+ci+"_idle0"];
  const ok=spr&&spr._ok;
  const k=1.02;                                   // hệ số phóng to (nhỏ lại theo yêu cầu)
  const dw=(ok?spr.naturalWidth:80)*k, dh=(ok?spr.naturalHeight:120)*k;
  let jy=0, jp=0; if(h.jumpT>0){ jp=1-h.jumpT/0.62; jy=-Math.sin(Math.pow(jp,0.72)*Math.PI)*152; }   // bật CAO, vọt lên nhanh (hoảng hốt)
  shadow(h.x,h.y,Math.max(12,dw*0.40*(1+jy/220)));       // bóng nhỏ hẳn khi bay cao
  if(h.golden){ cx.strokeStyle="#fbbf24"; cx.lineWidth=3; cx.globalAlpha=.9; cx.beginPath(); cx.arc(h.x,h.y-dh*0.42+jy,dw*0.55,0,6.283); cx.stroke(); cx.globalAlpha=1; }
  cx.save(); cx.imageSmoothingEnabled=false;
  const rot = h.jumpT>0 ? Math.sin(jp*Math.PI)*0.18*h.face : 0;   // hơi lắc người khi hoảng
  cx.translate(h.x, h.y-dh*0.5+8+jy); cx.rotate(rot); cx.translate(-h.x, -(h.y-dh*0.5+8+jy));
  if(h.face<0){ cx.translate(h.x,0); cx.scale(-1,1); cx.translate(-h.x,0); }
  if(ok) cx.drawImage(spr, h.x-dw/2, h.y-dh+8+jy, dw, dh);   // +jy = bật lên
  cx.restore();
  if(h.jumpT>0 && jp<0.7){ cx.fillStyle="#ff5a5a"; cx.strokeStyle="#3a0000"; cx.lineWidth=3; cx.font="bold 26px 'Segoe UI',sans-serif"; cx.textAlign="center"; cx.strokeText("!",h.x+dw*0.36,h.y-dh+jy-4); cx.fillText("!",h.x+dw*0.36,h.y-dh+jy-4); }
  if(napping){
    cx.fillStyle="#c9d4f0"; cx.font="bold 24px 'Segoe UI',sans-serif"; cx.textAlign="left";
    const zt=animClock*1.2;
    for(let i=0;i<3;i++){ cx.globalAlpha=0.5+0.5*Math.sin(zt-i); cx.fillText("z",h.x+dw*0.3+i*12,h.y-dh-i*16); }
    cx.globalAlpha=1;
  }
}

function tapAt(p){
  // Gift
  for(let i=gifts.length-1;i>=0;i--) if(dist2(p.x,p.y,gifts[i].x,gifts[i].y-14)<28*28){ openGift(gifts[i]); gifts.splice(i,1); return; }
  // Thief
  for(let i=thieves.length-1;i>=0;i--) if(dist2(p.x,p.y,thieves[i].x,thieves[i].y-20)<28*28){
    if(--thieves[i].hp<=0){ thieves.splice(i,1); buffThief=30; toast(t("thiefKill")); doShake(6); }
    return;
  }
  // Boss
  const bossR=isCat()?78:52, bossY=isCat()?50:40;
  if(boss && dist2(p.x,p.y,boss.x,boss.y-bossY)<bossR*bossR){ hitBoss(boss.max*0.035); return; }
  // Human / Mèo — vùng chạm to hơn, canh giữa thân
  const hitY=isCat()?66:20, hitR=isCat()?95:52;
  let best=null,bd=hitR*hitR;
  for(const h of humans){ if(h.state==="down"||h.sleep) continue; const d=dist2(p.x,p.y,h.x,h.y-hitY); if(d<bd){bd=d;best=h;} }
  if(best){ knock(best,"click"); fx.push({k:"punch",x:best.x,y:best.y-(isCat()?40:0),t:.25}); doShake(2); }
}

let tab="items";
function updateHUD(){
  document.getElementById("hudCoin").textContent=fmt(S.coin);
  document.getElementById("reincN").textContent=S.treePoint;
  const rb=document.getElementById("bReinc"); rb.classList.toggle("hot",S.treePoint>0);
  // tiêu đề tab
  document.getElementById("tabName").textContent = tab==="items"?t("tabItems"):tab==="upg"?t("tabUpg"):t("tabInfo");
  // trong màn cây kỹ năng
  const tps=document.getElementById("treePts"); if(tps) tps.textContent=t("pointLeft",S.treePoint);
  const need=S.treeLevel<TREE_REQ.length?TREE_REQ[S.treeLevel]:null;
  const tf=document.getElementById("tpTreeFill"); if(tf) tf.style.width=(need?clamp(S.treeExp/need,0,1)*100:100)+"%";
  const tn=document.getElementById("tpTreeNum"); if(tn) tn.textContent=(need?t("collect",fmt(S.treeExp),fmt(need)):t("max"));
  refreshList();
}
function refreshList(){
  const box=document.getElementById("list");
  if(box.dataset.tab!==tab){ box.dataset.tab=tab; box.innerHTML=""; }
  if(tab==="items") renderItems(box);
  else if(tab==="upg") renderUpg(box);
  else renderInfo(box);
}
function rowEl(box,id){
  let e=box.querySelector('[data-id="'+id+'"]');
  if(!e){ e=document.createElement("div"); e.className="row"; e.dataset.id=id; box.appendChild(e); }
  return e;
}
function buyItem(s){
  const p=shopPrice(s); if(p===null||S.coin<p) return;
  S.coin-=p; S.itemLv[s.k]=itemLv(s.k)+1;
  if(s.cat==="human") humans.push(mkHuman(s.k));
  else if(s.cat==="animal") animals.push(mkAnimal(s.k));
  else collectors.push({x:rnd(100,W-100),y:rnd(100,H-100)});
  humans.forEach(h=>{if(!h.tx)retargetHuman(h);});
  updateHUD(); save();
}
function renderItems(box){
  for(const s of SHOP){
    const el=rowEl(box,"i_"+s.k);
    // Mèo mở TUẦN TỰ: bậc sau chỉ HIỆN & mua được khi đã sở hữu ≥1 con bậc liền trước
    let show=true, seqUnlocked=true;
    if(s.cat==="human"){ const idx=TIERS.indexOf(s.k); if(idx>0){ const prevOwned=itemLv(TIERS[idx-1])>=1; show=prevOwned; seqUnlocked=prevOwned; } }
    el.style.display = show ? "" : "none";
    if(!show) continue;
    const unlocked = s.cat==="human" ? seqUnlocked : (s.req? treeHas(s.req) : true);
    const price=shopPrice(s), lv=itemLv(s.k);
    const val = s.cat==="human" ? humanValue(s.k) : null;
    const afford = unlocked && price!==null && S.coin>=price;
    if(!el._built){                                  // dựng khung 1 LẦN -> nút KHÔNG bị thay mới -> không nuốt click
      const icon=catShopIcon(s.k)||uiURL("u_"+s.k);
      const badge = icon ? `<img class="uicon" src="${icon}">` : `<span class="dot" style="background:${TIER_COL[s.k]||"#22d3ee"}"></span>`;
      el.innerHTML=`<div class="rowhead"><b>${badge}<span class="nm"></span></b><span class="lv"></span></div>
        <div class="rowdes"></div>
        <div class="rowfoot"><button class="btn buy"></button></div>`;
      el._nm=el.querySelector(".nm"); el._lv=el.querySelector(".lv"); el._des=el.querySelector(".rowdes"); el._btn=el.querySelector("button");
      el._btn.onclick=()=>buyItem(s);
      el._built=true;
    }
    el.classList.toggle("locked",!unlocked);
    el._nm.textContent=dispName(s.k);
    el._lv.textContent=lv+(s.p.length?" / "+s.p.length:"");
    el._des.textContent = val!==null?("★ "+fmt(val)+" / lần ngã"):(s.cat==="animal"?("⏱ "+(BASE.animalEnergy+upgVal(s.k+"_Energy")).toFixed(0)+"s · ⬤ "+Math.round((1+upgVal(s.k+"_Size"))*100)+"%"):("◎ "+Math.round((BASE.collectorRadius+upgVal("Collector_Radius"))*100)+"%"));
    el._btn.disabled=!afford;
    el._btn.textContent = price===null?t("max"):t("buy")+" ·"+fmt(price);
  }
}

function upgDes(key){

  const tb=UPG[key], lv=upgLv(key);
  const next=tb[Math.min(lv+1,tb.length-1)][1];
  if(kind==="BaseValue") return t("BaseValue",fmt(next));
  if(kind==="ValueBonus") return t("ValueBonus",Math.round(next*100));
  if(kind==="Clumsy") return t("Clumsy",Math.round(next*100));

  if(kind==="Size") return t("Size",Math.round(next*100));

  if(kind==="Speed") return t("Speed",Math.round(next*100));

}

const tcv=document.getElementById("treeCv"), tcx=tcv.getContext("2d");
let tview={s:.3,ox:0,oy:0,drag:false,px:0,py:0}, hoverNode=null;
const GRID=400;
function treeResize(){
  const r=tcv.parentElement.getBoundingClientRect();
  if(r.width<10||r.height<10) return;              // overlay còn ẩn
  tcv.width=r.width*devicePixelRatio; tcv.height=r.height*devicePixelRatio;
  if(!tview.init){ tview.ox=r.width/2; tview.oy=r.height/2+GRID*tview.s*0.3; tview.init=1; }
  drawTree();
}
function treeCenter(){ tview.init=0; treeResize(); }
function t2s(x,y){ return {x:x*GRID*tview.s+tview.ox, y:-y*GRID*tview.s+tview.oy}; }
const NODE_ICON={
  Tree_GoldenAura_count:"✨", Tree_GoldenAura_radius:"✨",
  Tree_LuckyThief_count:"😾",
  Tree_Noble_Unlock:"⬛", Tree_Knight_Unlock:"🐱", Tree_King_Unlock:"👑", Tree_Elephant_Unlock:"🐕",
  Tree_Gift_Unlock:"🎁", Tree_First_Time_Gift:"🎁",
  Tree_Lightning_Unlock:"⚡", Tree_Lightning_cooldown:"⚡",
  Tree_Rocket_Unlock:"☄️", Tree_Rocket_cooldown:"☄️",
  Tree_ChainReaction_Unlock:"🔗", Tree_ChainReaction_Percent:"🔗", Tree_ChainReaction_radius:"🔗",
  Tree_AutoBreaker_Unlock:"👆", Tree_LuckyFall_Unlock:"🍀",
  Tree_Animal_Reward:"🐶", Tree_Animal_Reward_Bonus:"🐶", Tree_Collector_Lucky:"🤖",
  Tree_Guardian_Count:"🛡️", Tree_Inheritance:"♻️", Tree_Golden_Punch:"🌟",
  Tree_Commoner_value:"💰", Tree_Clown_value:"💰", Tree_Soldier_value:"💰",
  Tree_Noble_value:"💰", Tree_Knight_value:"💰", Tree_King_value:"💰",
};
function drawTree(){
  const r=tcv.parentElement.getBoundingClientRect();
  tcx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  tcx.fillStyle="#0b0d13"; tcx.fillRect(0,0,r.width,r.height);
  // cạnh (ô kề trực giao)
  const all=[{i:-1,x:0,y:0,root:1},...TREE];
  tcx.lineWidth=Math.max(1.5,3*tview.s*3);
  for(const n of all){
    for(const [dx,dy] of [[1,0],[0,1]]){
      const m=all.find(o=>o.x===n.x+dx&&o.y===n.y+dy); if(!m) continue;
      const openA=n.root||nodeOpen(n.i), openB=m.root||nodeOpen(m.i);
      const visA=n.root||nodeVisible(n), visB=m.root||nodeVisible(m);
      if(!visA&&!visB) continue;
      const a=t2s(n.x,n.y), b=t2s(m.x,m.y);
      tcx.strokeStyle=(openA&&openB)?"#a78bfa":"#39405a";
      tcx.beginPath(); tcx.moveTo(a.x,a.y); tcx.lineTo(b.x,b.y); tcx.stroke();
    }
  }
  // node
  const R=Math.max(9,58*tview.s);
  for(const n of all){
    const p=t2s(n.x,n.y);
    if(p.x<-80||p.x>r.width+80||p.y<-80||p.y>r.height+80) continue;
    const open=n.root||nodeOpen(n.i);
    const vis=n.root||nodeVisible(n);
    const dl=!n.root&&S.set.demo&&n.demo;
    if(!vis){ tcx.fillStyle="#181c28"; tcx.beginPath(); tcx.arc(p.x,p.y,R*.55,0,6.283); tcx.fill(); continue; }
    tcx.beginPath(); tcx.arc(p.x,p.y,R,0,6.283);
    tcx.fillStyle = n.root?"#4c1d95" : dl?"#2a2130" : open?"#2f2a52":"#1c2130";
    tcx.fill();
    tcx.lineWidth=Math.max(1.5,3*tview.s*2);
    tcx.strokeStyle = n.root?"#a78bfa" : dl?"#6b4a7a" : open?"#a78bfa" : (canUnlock(n)&&S.treePoint>0)?"#4ade80":"#39405a";
    tcx.stroke();
    if(hoverNode===n){ tcx.strokeStyle="#fff"; tcx.lineWidth=2; tcx.beginPath(); tcx.arc(p.x,p.y,R+4,0,6.283); tcx.stroke(); }
    // icon node = EMOJI (bản clean không dùng ảnh ui.js gốc) — hiện được cả khi zoom nhỏ
    if(R>9){
      const em=n.root?"⭐":(NODE_ICON[n.k]||"◆");
      tcx.save();
      if(dl||(!n.root&&!open&&!(canUnlock(n)&&S.treePoint>0))) tcx.globalAlpha=.5;
      tcx.textAlign="center"; tcx.textBaseline="middle";
      tcx.font=Math.round(R*0.95)+"px 'Segoe UI Emoji','Segoe UI Symbol','Noto Color Emoji',sans-serif";
      tcx.fillText(em,p.x,p.y);
      tcx.restore();
      // badge trạng thái: ✓ đã mở · 🔒 khoá demo
      if(!n.root && (open||dl) && R>13){
        tcx.textAlign="center"; tcx.textBaseline="middle";
        tcx.font="700 "+Math.max(9,R*.5)+"px 'Segoe UI Emoji',sans-serif";
        tcx.fillStyle=open?"#4ade80":"#b58ac9";
        tcx.fillText(open?"✓":"🔒",p.x+R*0.66,p.y-R*0.62);
      }
    }
  }
}
function shortName(k){ return k.replace("Tree_","").replace(/_/g," "); }
function wrapText(c,txt,x,y,maxW,lh){
  const words=txt.split(" "); let line="",lines=[];
  for(const w of words){ const test=line?line+" "+w:w; if(c.measureText(test).width>maxW&&line){lines.push(line);line=w;} else line=test; }
  lines.push(line);
  const off=-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>c.fillText(l,x,y+off+i*lh));
}
function treeNodeAt(mx,my){
  const R=Math.max(9,58*tview.s);
  const all=[{i:-1,x:0,y:0,root:1},...TREE];
  for(const n of all){ const p=t2s(n.x,n.y); if(dist2(mx,my,p.x,p.y)<R*R) return n; }
  return null;
}
tcv.addEventListener("mousedown",e=>{tview.drag=true;tview.px=e.clientX;tview.py=e.clientY;tcv.style.cursor="grabbing";});
addEventListener("mouseup",()=>{tview.drag=false;tcv.style.cursor="grab";});
function doTreeNode(n){
  if(!n||n.root) return;
  if(nodeOpen(n.i)){
    if(canLock(n)){ S.nodes=S.nodes.filter(i=>i!==n.i); S.treePoint++; onTreeChange(); }
  } else if(canUnlock(n) && S.treePoint>0){
    S.nodes.push(n.i); S.treePoint--; onTreeChange();
  }
}
function showTreeTip(n,mx,my,rw,hint){
  const tip=document.getElementById("treeTip");
  if(n&&!n.root){
    const dl=S.set.demo&&n.demo;
    const disp=n.pct?((n.v>=1?"×"+n.v:"+"+Math.round(n.v*100)+"%")):(n.v>0?"+"+n.v:n.v+"s");
    tip.innerHTML=`<b>${shortName(n.k)}</b>${NODE_DES[lang][n.k]||""}<br><span style="color:#a78bfa">${disp}</span>${dl?'<br><span style="color:#f87171">'+t("demoNode")+"</span>":""}${hint?'<br><span style="color:#ffc94a">'+hint+"</span>":""}`;
    tip.style.display="block"; tip.style.left=Math.min(mx+16,rw-280)+"px"; tip.style.top=(my+16)+"px";
  } else tip.style.display="none";
}
tcv.addEventListener("mousemove",e=>{
  const r=tcv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  if(tview.drag){ tview.ox+=e.clientX-tview.px; tview.oy+=e.clientY-tview.py; tview.px=e.clientX; tview.py=e.clientY; drawTree(); return; }
  const n=treeNodeAt(mx,my);
  if(n!==hoverNode){ hoverNode=n; drawTree(); }
  showTreeTip(n,mx,my,r.width);
});
tcv.addEventListener("click",e=>{
  const r=tcv.getBoundingClientRect();
  doTreeNode(treeNodeAt(e.clientX-r.left,e.clientY-r.top));
});
// ── Cảm ứng cây kỹ năng: kéo để di chuyển · chạm node xem NOTE · chạm lần nữa để mở khoá ──
let treeTS=null, treeMoved=false, treeSel=null;
tcv.addEventListener("touchstart",e=>{ if(e.cancelable)e.preventDefault(); const tp=e.touches[0]; treeTS={x:tp.clientX,y:tp.clientY}; treeMoved=false; },{passive:false});
tcv.addEventListener("touchmove",e=>{ if(e.cancelable)e.preventDefault(); if(!treeTS)return; const tp=e.touches[0]; const dx=tp.clientX-treeTS.x, dy=tp.clientY-treeTS.y; if(treeMoved||Math.hypot(dx,dy)>6){ treeMoved=true; tview.ox+=tp.clientX-treeTS.x; tview.oy+=tp.clientY-treeTS.y; treeTS={x:tp.clientX,y:tp.clientY}; drawTree(); } },{passive:false});
tcv.addEventListener("touchend",e=>{
  if(!treeTS || treeMoved){ treeTS=null; return; }
  treeTS=null;
  const tp=e.changedTouches[0], r=tcv.getBoundingClientRect(), mx=tp.clientX-r.left, my=tp.clientY-r.top;
  const n=treeNodeAt(mx,my);
  if(!n||n.root){ treeSel=null; document.getElementById("treeTip").style.display="none"; return; }
  hoverNode=n; drawTree();
  if(treeSel===n){                                   // chạm lần 2 cùng node -> mở khoá / gỡ
    doTreeNode(n); treeSel=null;
    showTreeTip(n,mx,my,r.width, lang==="vi"?"✓ Đã cập nhật":"✓ Updated");
  } else {                                           // chạm lần 1 -> xem note + gợi ý
    treeSel=n;
    const canU=!nodeOpen(n.i)&&canUnlock(n)&&S.treePoint>0, canL=nodeOpen(n.i)&&canLock(n);
    const hint = canU?(lang==="vi"?"👆 Chạm lần nữa để MỞ KHOÁ (−1 điểm)":"👆 Tap again to UNLOCK (−1 pt)")
               : canL?(lang==="vi"?"👆 Chạm lần nữa để GỠ (+1 điểm)":"👆 Tap again to REMOVE (+1 pt)")
               : (!nodeOpen(n.i)&&S.treePoint<=0?(lang==="vi"?"Cần điểm kỹ năng":"Need a skill point"):"");
    showTreeTip(n,mx,my,r.width,hint);
  }
},{passive:false});
tcv.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=tcv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const old=tview.s;
  tview.s=clamp(tview.s*(e.deltaY<0?1.13:0.885),0.1,0.75);
  tview.ox=mx-(mx-tview.ox)*(tview.s/old); tview.oy=my-(my-tview.oy)*(tview.s/old);
  drawTree();
},{passive:false});

function coachText(st){ return lang==="vi"?st.vi:st.en; }
function coachOkLabel(st){ return lang==="vi"?(st.last?"Bắt đầu chơi 🎉":"Đã hiểu 👍"):(st.last?"Start 🎉":"Got it 👍"); }
function coachEnter(){
  const st=COACH[coachI];
  if(st.enter) st.enter();
  document.getElementById("coachMsg").textContent=coachText(st);
  const ok=document.getElementById("coachOk"); ok.hidden=!st.ok; ok.textContent=coachOkLabel(st);
  document.querySelectorAll(".tut-hl").forEach(e=>e.classList.remove("tut-hl"));
  if(st.hl && st.hl!=="#stage"){ const el=document.querySelector(st.hl); if(el) el.classList.add("tut-hl"); }
}
function coachStart(){ coachI=0; document.getElementById("coach").classList.add("on"); coachEnter(); }
function coachStop(){ coachI=-1; document.getElementById("coach").classList.remove("on"); document.querySelectorAll(".tut-hl").forEach(e=>e.classList.remove("tut-hl")); S.set.tutDone=true; S.set.tutVer=TUT_VERSION; save(); }
function coachNext(){ coachI++; if(coachI>=COACH.length){ coachStop(); return; } coachEnter(); }
function coachTick(){ if(coachI<0) return; const st=COACH[coachI]; if(st.done && st.done()) coachNext(); }
document.getElementById("coachOk").onclick=coachNext;
document.getElementById("bHelp").onclick=coachStart;

/* ─────────────────────────── 12. KHỞI ĐỘNG ─────────────────────────── */
function skinUI(){
  document.querySelectorAll("img[data-ui]").forEach(im=>{ const u=uiURL(im.dataset.ui); if(u){ im.src=u; } else { im.style.display="none"; } });
  injectFrames();
}
// 9-slice khung gốc bằng border-image (data URI từ ui.js) — bám sát khung game gốc
function injectFrames(){
  const gold=uiURL("frame_gold"), wood=uiURL("menubox"), slot=uiURL("panel_slot"), goldbtn=uiURL("btn_buy");
  if(!gold&&!wood&&!slot) return;
  const css=[];
  if(gold) css.push(`#listframe{border:17px solid transparent;border-image:url("${gold}") 26 fill stretch;box-shadow:none;background:none;padding:0}`);
  if(slot){
    css.push(`.row{border:11px solid transparent;border-image:url("${slot}") 17 fill stretch;background:none;border-radius:0;margin-bottom:4px;padding:2px 6px 6px}`);
    css.push(`.row .rowhead{margin-top:-2px}`);
  }
  if(wood){
    css.push(`.tabb{border:11px solid transparent;border-image:url("${wood}") 9 fill stretch;background:none;box-shadow:none;border-radius:0}`);
    css.push(`#botbar{border:12px solid transparent;border-image:url("${wood}") 9 fill stretch;background:none;border-radius:0}`);
    css.push(`.botb{border:9px solid transparent;border-image:url("${wood}") 9 fill stretch;background:none;border-radius:0}`);
  }
  if(goldbtn) css.push(`.tabb.on{border:11px solid transparent;border-image:url("${goldbtn}") 12 fill stretch;box-shadow:0 0 12px #ffc94a66}`);
  let st=document.getElementById("frameCSS");
  if(!st){ st=document.createElement("style"); st.id="frameCSS"; document.head.appendChild(st); }
  st.textContent=css.join("\n");
}
load();
document.getElementById("cShake").checked=S.set.shake;
document.getElementById("cHide").checked=S.set.hideMoney;
document.getElementById("rCursor").value=S.set.cursor;
document.getElementById("cDemo").checked=S.set.demo;
resize(); startSession(); skinUI(); applyLang(); updateHUD();
if(!S.set.tutDone || (S.set.tutVer||0)<TUT_VERSION) coachStart();   // lần đầu chơi HOẶC sau khi nâng version hướng dẫn
new ResizeObserver(()=>{resize();}).observe(document.getElementById("stage"));
new ResizeObserver(()=>{treeResize();}).observe(document.getElementById("treeCv").parentElement);
addEventListener("beforeunload",save);
requestAnimationFrame(loop);
